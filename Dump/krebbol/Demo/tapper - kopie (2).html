<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Document</title>
    <style>
        html, body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            margin: 0;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            touch-action: manipulation;
            cursor: default;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-callout: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            -webkit-user-modify: none;
            -webkit-highlight: none;
        }
        dot {
            background: green;
            height: 100px;
            width: 100px;
            position: absolute;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <main onload="">
        <!--<dot>h</dot>-->
        <div id="dotbox"></div>
    </main>
    <script>

        var touchPoints = new Array();

        function touch(event){
            //console.log(event.type,event.type=="touchend")

            var dotbox = document.getElementById("dotbox");
            Array.from(event.changedTouches).forEach(touch=>{

                if(event.type=="touchstart") touchPoints[touch.identifier] = dotbox.appendChild(document.createElement("dot"));
                if(event.type=="touchend") dotbox.removeChild(touchPoints[touch.identifier]);
                touchPoint = touchPoints[touch.identifier];

                var multiplier = 500;

                //var size = touch.force;
                
                touchPoint.style.top = touch.clientY - touch.force * multiplier / 2 + "px";
                touchPoint.style.left = touch.clientX - touch.force * multiplier / 2 + "px";
                touchPoint.style.height = touchPoint.style.width = touch.force * multiplier + "px";
                touchPoint.style.borderRadius = touch.force * multiplier / 2 + "px";
            });
                //console.log("ba kaboek kabul", touch)
            
            //if(event.type=="touchstart") Array.from(event.changedTouches).forEach(touch=> touchPoints[touch.identifier] = dotbox.appendChild(document.createElement("dot")));
            //if(event.type=="touchend") Array.from(event.changedTouches).forEach(touch=> dotbox.removeChild(touchPoints[touch.identifier]));
            /*
            console.log(event)
            event.returnValue = false;
            for (let index = 0; index < changedTouches.length; index++) {
                var touch = changedTouches[index];
                //var index = touch.identifier;

                var multiplier = 500;

                var size = touch.force;
                touchPoints[index].style.top = touch.clientY - touch.force * multiplier / 2 + "px";
                touchPoints[index].style.left = touch.clientX - size * multiplier / 2 + "px";
                touchPoints[index].style.height = touchPoints[index].style.width = size * multiplier + "px";
                touchPoints[index].style.borderRadius = size * multiplier / 2 + "px";
            }*/
        }

        function detectDoubleTapClosure() {
  let lastTap = 0;
  let timeout;
  return function detectDoubleTap(event) {
    const curTime = new Date().getTime();
    const tapLen = curTime - lastTap;
    if (tapLen < 500 && tapLen > 0) {
      console.log('Double tapped!');
      event.preventDefault();
    } else {
      timeout = setTimeout(() => {
        clearTimeout(timeout);
      }, 500);
    }
    lastTap = curTime;
  };
}

        document.addEventListener("mousedown", touch);
        document.addEventListener("touchforcechange", touch);
        document.addEventListener("touchcancel", touch);
        document.addEventListener("touchstart", touch);
        document.addEventListener("touchmove", touch);
        document.addEventListener("touchend", touch);
        document.body.addEventListener('touchend', detectDoubleTapClosure());
    </script>
    
    
</body>
</html>
