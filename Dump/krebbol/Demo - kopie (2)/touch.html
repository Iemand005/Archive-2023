        function setCoord(touch){
            //console.log(coordcontitems)
            if(!coordcontitems) {
                coordcontitems = new Array();
                var coordcontainer = document.getElementById("coordcontainer");
                for(var properT in touch) {
                    
                    var element = document.createElement("p");
                    coordcontainer.appendChild(element);
                    coordcontitems[properT] = element;
                }
            }
            for(var properT in touch) {
                coordcontitems[properT].innerHTML = touch[properT];
            }
        }

        document.addEventListener("mousedown", touch);
        document.addEventListener("touchforcechange", touch);
