<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         none{
            height:100%;
            width:100%;
            margin:0;
         }
    </style>
</head>
<body>
    <canvas id="board"></canvas>
    <script>
        class Simulation{
            constructor(){
                var board = document.getElementById("board");
                var ctx = board.getContext("2d");
                var canvas = ctx.canvas;
                canvas.width  = 200;
                canvas.height = 200;
                //ctx.canvas.width  = window.innerWidth;
                //ctx.canvas.height = window.innerHeight;
                var objects = new Array();
                
                
                function drawBall(x, y, size = 10, colour = "black"){

                }
                //#drawBall(10, 10, 10, "orange");

                function drawLine(x1, y1, x2, y2){
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                function drawVector(xv, yv, x = 0, y = 0){

                }

                function drawRect(x1, y1, x2, y2){
                    ctx.beginPath();
                    ctx.rect(x1, y1, x2, y2);
                    ctx.stroke();
                }

                function drawBorder(){
                    drawRect(0, 0, canvas.width, canvas.height);
                }

                function drawText(text, x=1, y=10){
                    ctx.strokeText(text, x, y);
                }

                class Vector{
                    constructor(xv, yv){
                        this.x = 0;
                        this.y = 0;
                        this.xv = xv;
                        this.yv = yv;
                        this.drawVector = ()=>{
                            ctx.beginPath();
                            ctx.moveTo(this.x, this.y);
                            ctx.lineTo(this.x+this.xv, this.y+this.yv);
                            ctx.stroke();
                        }
                        this.resolveDistances = function(){
                            for(var index in objects){
                                var object = objects[index];
                                drawText(index+": " +Math.round(object.x-this.x)+", "+Math.round(object.y-this.y), this.x+1*index, this.y-10*index)
                            }
                            //objects.forEach(object=>drawText(object.x-this.x, this.x+1, this.y+1));
                        }
                    }
                }

                class Object extends Vector{
                    constructor(){
                        super();
                        this.object = true;
                    }
                }
                
                class Ball extends Object{
                    constructor(x = 0, y = 0, size = 10, colour = "orange", xv = 0, yv = 0){
                        super()
                        this.x = x;
                        this.y = y;
                        this.xv = xv;
                        this.yv = yv;
                        this.size = size;
                        this.height = size;
                        this.width = size;
                        this.colour = colour;
                        this.draw = ()=>{
                            ctx.beginPath();
                            ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
                            ctx.fillStyle = this.colour;
                            ctx.fill();
                            this.rendertime = Date.now();
                        };
                        this.resolveStick = function(){
                            var stick = .6;
                            this.yv=this.yv>0? this.yv<stick? 0: this.yv: this.yv>-stick? 0: this.yv;
                            this.xv=this.xv>0? this.xv<stick? 0: this.xv: this.xv>-stick? 0: this.xv;
                        }
                        this.resolveBounds = function(){
                            var hitbound = false;
                            //var stick = .1;
                            var friction = 1.2;
                            if(this.x-this.width<1||this.width>canvas.width-1||this.y+this.height>canvas.height-1) this.resolveStick();//hitbound = true;
                            if(this.y+this.height>canvas.height-1) hitbound = true, 
                            
                            //console.log(this.yv)
                            //this.yv = ,
                            this.yv /=friction,this.yv=-this.yv;
                            //this.yv = this.yv>0?this.yv<stick? 0:this.yv>-stick? 0:-this.yv;
                            
                            //this.yv=this.yv>0? this.yv<stick? 0: -this.yv: this.yv>-stick? 0: -this.yv;//this.yv=0, this.y = 0;
                            //var cow = 0>1?true:false;

                            this.xv= this.x+this.width>canvas.width-1? -this.xv:this.x-this.width<1? -this.xv:this.xv;
                            //var stick = .1;
                            //this.yv=this.yv>0? this.yv<stick? 0: this.yv: this.yv>-stick? 0: this.yv;
                            //this.xv=this.xv>0? this.xv<stick? 0: this.xv: this.xv>-stick? 0: this.xv;
                            for(var index in objects){
                                var object = objects[index];
                                drawText(Math.round(object.x-this.x)+", "+Math.round(object.y-this.y), this.x+1*index, this.y-10*index)
                            }
                            if (hitbound) this.resolveStick();
                            return hitbound;
                        }

                    }
                }

                class Cursor extends Vector{
                    constructor(x = 0, y = 0){
                        super();
                        this.x = x, this.y = y;
                        this.size = 10;
                        this.update = function(x, y){
                            this.x = x-this.size/2, this.y = y-this.size/2;
                        }
                        this.draw = ()=>{
                            ctx.beginPath();
                            ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
                            ctx.fillStyle = "green";
                            ctx.fill();
                            this.rendertime = Date.now();
                        };
                    }
                }

                function clear(){
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }

                // this.renderFrame = function(){
                    
                //     this.updateSim();
                //     clear();
                //     drawBorder();
                //     objects.forEach(object=>{
                //         drawText(object.yv);
                //         object.draw();
                //         object.resolveDistances();
                //         object.drawVector();
                //     });
                // }

                function updateSim(objectso = objects){
                    // for(var index in objects){
                    //     object = objects[index];
                    //     var g = 9.81;
                    //     var gmul = 0.1;
                    //     var drag = 1;
                    //     object.xv += (g-drag)*gmul;
                    //     object.x += object.xv;
                    //     object.y += object.yv;
                    // }
                    objectso = objectso.map(object=>{
                        if(object.object){
                            var g = 9.81;
                            var gmul = 0.05;
                            var drag = 1.03;
                            object.yv += g*gmul// + ((object.yv+g*gmul)>0?-drag:drag)
                            object.yv /=drag;
                            object.xv /= drag;
                            //object.resolveStick();
                            object.resolveBounds();
                            object.x += object.xv;
                            object.y += object.yv;
                        }
                        return object;
                    });
                    //console.log(objectso)
                    //renderFrame(objectso);
                }

                this.updateSim = updateSim;
                

                function renderFrame() {
                    clear();
                    updateSim();
                    //clear();
                    drawBorder();
                    objects.forEach(object=>{
                        drawText(object.yv);
                        object.draw();
                        //object.resolveDistances();
                        object.drawVector();
                    });
                }

                this.renderFrame = renderFrame;
                
                this.cursor = new Cursor();
                objects.push(this.cursor);

                function initSim(){
                    //if(!objects)objects = 
                    objects = objects.concat([
                        new Ball(90, 50, 10, "orange", 1, 1),
                        new Ball(80, 189, 10, "red", 10, 0)
                    ]);
                }

                

                //initSim();
                //drawVector(10, 50);
                this.start = initSim;
            }
        }
        //cursor = new Simulation.Cursor();
        
        simulation = new Simulation();
        simulation.start();
        var fps = 60;
        window.setInterval(simulation.renderFrame, 1000/fps)
        window.addEventListener("mousemove", event=>{
            //console.log(event)
            simulation.cursor.update(event.x, event.y);
        })
        
    </script>
</body>
</html>
