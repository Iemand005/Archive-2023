    <main id="windows">
        <h1>Het ontwerp van Windows</h1>
        <p></p>
        <section class="iconprev">
            <figure>
                <img src="Assets/Fluent.png" alt="Windows 10">
                <figcaption>
                    <h2>Windows 10</h2>
                    <p>This is the icon used for the first revision of Fluent. The icon is flat without shadows and the tab header representation remains.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="Assets/FluentEvo.png" alt="Windows 10 at start of Sun Valley">
                <figcaption>
                    <h2>Windows 10 (1903)</h2>
                    <p>De eerste update van 2019 kwam met een nieuw icoon. Dit was bedoeld als onderdeel van de eerste stappen van de Sun Valley transitie</p>
                </figcaption>
            </figure>
            <figure>
                <img src="Assets/FluentEvoPrev.png" alt="Windows Explorer Icon Version 3">
                <figcaption>
                    <h2>Windows 11 Preview</h2>
                    <p>Dit icoon was een van de vele test ontwerpen gemaakt bij de transitie naar Sun Valley.</p>
                </figcaption>                      
            </figure>
            <figure>
                <img src="Assets/Fluent2.png" alt="Windows Explorer Icon Version 4">
                <figcaption>
                    <h2>Windows 11</h2>
                    <p>Describe the Finder icon in Mac OS X and its design evolution.</p>
                </figcaption>                      
            </figure>
        </section>
    </main>
